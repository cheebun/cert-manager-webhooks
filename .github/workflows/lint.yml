name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [alidns, namesilo, spaceship, tencent]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: webhooks/${{ matrix.provider }}/go.mod
          cache-dependency-path: webhooks/${{ matrix.provider }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: webhooks/${{ matrix.provider }}

  lint-helm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [alidns-webhook, namesilo-webhook, spaceship-webhook, tencent-webhook]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/${{ matrix.chart }}

  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [alidns, namesilo, spaceship, tencent]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: webhooks/${{ matrix.provider }}/go.mod
          cache-dependency-path: webhooks/${{ matrix.provider }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./...
        working-directory: webhooks/${{ matrix.provider }}
