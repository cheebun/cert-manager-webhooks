version: 2

project_name: spaceship-webhook

builds:
  - id: spaceship-webhook
    binary: webhook
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -extldflags "-static"
    flags:
      - -trimpath

dockers:
  - id: spaceship-webhook-amd64
    ids:
      - spaceship-webhook
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/spaceship:{{ .Tag }}-amd64
    build_flag_templates:
      - --platform=linux/amd64

  - id: spaceship-webhook-arm64
    ids:
      - spaceship-webhook
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/spaceship:{{ .Tag }}-arm64
    build_flag_templates:
      - --platform=linux/arm64

docker_manifests:
  - name_template: ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/spaceship:{{ .Tag }}
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/spaceship:{{ .Tag }}-amd64
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/spaceship:{{ .Tag }}-arm64

  - name_template: ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/spaceship:latest
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/spaceship:{{ .Tag }}-amd64
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/spaceship:{{ .Tag }}-arm64

archives:
  - id: spaceship-webhook
    format: tar.gz
    name_template: "spaceship-webhook_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "spaceship-webhook_{{ .Version }}_checksums.txt"

release:
  disable: true

changelog:
  disable: true
